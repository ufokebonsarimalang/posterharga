<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator Poster Clearance Sale A4 - UFO Kebonsari</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; font-family: 'Outfit', sans-serif !important; }
        body {
            margin: 0; padding: 20px; min-height: 100vh;
            background: linear-gradient(135deg, #0b0f19 0%, #111827 100%);
            color: #f3f4f6; display: flex; flex-direction: column; align-items: center;
        }
        .container {
            width: 100%; max-width: 600px; background: #111827;
            border: 1px solid rgba(212, 175, 55, 0.3); border-radius: 20px;
            padding: 30px; box-shadow: 0 20px 40px rgba(0,0,0,0.6); margin-top: 20px;
        }
        h2 { text-align: center; color: #d4af37; margin-top: 0; font-weight: 800; }
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; font-size: 12.5px; font-weight: 700; color: #d1d5db; margin-bottom: 8px; }
        .input-group input, .input-group select {
            width: 100%; padding: 14px 16px; border-radius: 12px; border: 1px solid #374151;
            background: #1f2937; color: #ffffff; font-size: 15px; outline: none;
        }
        .input-group input:focus, .input-group select:focus { border-color: #d4af37; }
        button {
            width: 100%; padding: 16px; border: none; border-radius: 12px; cursor: pointer;
            font-weight: 800; font-size: 16px; color: #111827; background: linear-gradient(135deg, #f3e8ff 0%, #d4af37 100%);
            box-shadow: 0 10px 20px -5px rgba(212, 175, 55, 0.3); transition: 0.2s;
        }
        button:hover { opacity: 0.95; transform: translateY(-2px); }
        #previewArea { margin-top: 25px; text-align: center; width: 100%; }
        
        #popup { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); z-index: 99999; justify-content: center; align-items: center; }
        .modern-popup-box { background: #111827; padding: 25px; border-radius: 16px; text-align: center; border: 1px solid rgba(212, 175, 55, 0.4); }
    </style>
</head>
<body>

    <h1 style="color: #ffffff; font-weight: 800; margin-bottom: 5px; text-align:center;">UFO KEBONSARI MALANG</h1>
    <p style="color: #9ca3af; margin-top: 0; font-size: 14px;">Generator Ganti Harga & Logo Otomatis</p>

    <div class="container">
        <h2>🏷️ Input Data Promosi</h2>

        <div class="input-group">
            <label>PILIH BRAND PRODUK</label>
            <select id="genBrand">
                <option value="beko">Beko</option>
                <option value="samsung">Samsung</option>
                <option value="lg">LG</option>
                <option value="polytron">Polytron</option>
                <option value="sharp">Sharp</option>
            </select>
        </div>

        <div class="input-group">
            <label>HARGA NORMAL (CORET)</label>
            <input type="text" id="genHargaAwal" placeholder="Contoh: Rp 13.998.000" oninput="formatRupiahInput(this)">
        </div>

        <div class="input-group">
            <label>HARGA CLEARANCE / SPESIAL</label>
            <input type="text" id="genHargaDiskon" placeholder="Contoh: Rp 8.699.000" oninput="formatRupiahInput(this)">
        </div>

        <button onclick="generatePosterTemplate()">🖨️ Buat & Download Poster A4</button>

        <div id="previewArea"></div>
    </div>

<script>
function formatRupiahInput(el) {
    let val = el.value.replace(/[^,\d]/g, "").toString();
    let split = val.split(",");
    let sisa = split[0].length % 3;
    let rupiah = split[0].substr(0, sisa);
    let ribuan = split[0].substr(sisa).match(/\d{3}/gi);
    if (ribuan) {
        let separator = sisa ? "." : "";
        rupiah += separator + ribuan.join(".");
    }
    rupiah = split[1] !== undefined ? rupiah + "," + split[1] : rupiah;
    el.value = rupiah ? "Rp " + rupiah : "";
}

function generatePosterTemplate() {
    let brand = document.getElementById("genBrand").value;
    let hargaAwal = document.getElementById("genHargaAwal").value || "Rp 0";
    let hargaDiskon = document.getElementById("genHargaDiskon").value || "Rp 0";

    showPopup("Sedang memproses template, logo, dan harga...");

    let canvas = document.createElement("canvas");
    canvas.width = 2480;  // Standar Cetak A4 (300 DPI)
    canvas.height = 3508;
    let ctx = canvas.getContext("2d");

    // 1. Muat Template Master Utama
    let templateImg = new Image();
    templateImg.crossOrigin = "anonymous";
    templateImg.src = "template.png";

    templateImg.onload = function() {
        // Gambar template master
        ctx.drawImage(templateImg, 0, 0, canvas.width, canvas.height);

        // 2. TIMPA LOGO BRAND LAMA DI KANAN ATAS DENGAN WARNA PUTIH
        // (Koordinat ini menutup bersih area logo brand bawaan template sebelum diganti logo baru)
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(1500, 50, 850, 250);

        // Muat Logo Brand Baru Sesuai Pilihan Dropdown
        let logoBrand = new Image();
        logoBrand.crossOrigin = "anonymous";
        logoBrand.src = `${brand}.png`;

        logoBrand.onload = function() {
            let bWidth = 650;
            let bHeight = (logoBrand.height / logoBrand.width) * bWidth;
            ctx.drawImage(logoBrand, canvas.width - bWidth - 120, 70, bWidth, bHeight);
            
            lanjutkanTutupHarga();
        };

        logoBrand.onerror = function() {
            lanjutkanTutupHarga(); // Tetap lanjut jika logo gagal dimuat
        };
    };

    templateImg.onerror = function() {
        tutupPopup();
        alert("Gagal memuat 'template.png'. Pastikan file template sudah ada di root GitHub.");
    };

    // 3. Timpa Harga Lama dan Tulis Harga Baru
    function lanjutkanTutupHarga() {
        // -- Tutup & Ganti Harga Normal --
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(680, 1180, 1450, 310);

        ctx.fillStyle = "#0f172a";
        ctx.font = "800 115px 'Outfit', sans-serif";
        ctx.textAlign = "left";
        ctx.fillText(hargaAwal, 750, 1370);

        // Garis coret merah baru
        ctx.strokeStyle = "#dc2626";
        ctx.lineWidth = 14;
        ctx.beginPath();
        ctx.moveTo(720, 1335);
        ctx.lineTo(2100, 1335);
        ctx.stroke();

        // -- Tutup & Ganti Harga Spesial / Clearance --
        ctx.fillStyle = "#1e3a8a";
        ctx.fillRect(280, 2090, 1920, 310);

        ctx.fillStyle = "#ffffff";
        ctx.font = "900 185px 'Outfit', sans-serif";
        ctx.textAlign = "left";
        ctx.fillText(hargaDiskon, 700, 2305);

        tutupPopup();

        // 4. Siapkan Hasil Download HD
        let imageURL = canvas.toDataURL("image/png", 1.0);
        let previewContainer = document.getElementById("previewArea");
        previewContainer.innerHTML = `
            <div style="background:#1f2937; padding:20px; border-radius:14px; display:inline-block; border:1px solid #374151;">
                <p style="color:#34d399; font-weight:700; margin-bottom:10px;">✅ Logo & Harga Berhasil Diperbarui!</p>
                <a href="${imageURL}" download="Poster_Clearance_${brand}_${Date.now()}.png" style="display:inline-block; padding:12px 24px; background:#10b981; color:#fff; font-weight:800; text-decoration:none; border-radius:8px;">
                    📥 Download Poster A4 (HD)
                </a>
            </div>
        `;
    }
}

function showPopup(pesan) {
    let p = document.getElementById("popup");
    if(!p) {
        let div = document.createElement("div");
        div.id = "popup";
        div.innerHTML = `<div class="modern-popup-box"><h3 style="color:#d4af37; margin-top:0;">Informasi</h3><p id="popupText" style="color:#fff;"></p></div>`;
        document.body.appendChild(div);
    }
    document.getElementById("popupText").innerText = pesan;
    document.getElementById("popup").style.display = "flex";
}
function tutupPopup() { 
    let p = document.getElementById("popup");
    if(p) p.style.display = "none"; 
}
</script>

</body>
</html>
