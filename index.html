<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Generator Price Tag UFO Electronics</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#eef3fb;color:#102a5c}
.wrap{max-width:1100px;margin:auto;padding:22px}
h1{margin:0 0 6px;font-size:28px}
.sub{margin:0 0 18px;color:#5b6b86}
.panel{background:white;border-radius:18px;padding:18px;box-shadow:0 8px 30px #0001;margin-bottom:20px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:14px}
label{font-weight:700;font-size:14px;display:block;margin-bottom:7px}
input{width:100%;padding:11px 14px;border:1px solid #ccd6e8;border-radius:10px;font-size:16px;outline:none;background:#fff;color:#102a5c;font-family:Arial,sans-serif}
input:focus{border-color:#1558c0;box-shadow:0 0 0 3px #1558c015}
.pos-box{background:#f4f7fc;padding:12px;border-radius:12px;margin-top:10px;border:1px solid #d8e2f3}
.pos-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:8px}
.buttons{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}
button{border:0;border-radius:10px;padding:13px 18px;font-size:16px;font-weight:700;cursor:pointer}
.primary{background:#0b4db8;color:#fff}
.secondary{background:#e8eef8;color:#123c78}
.preview{display:flex;justify-content:center}
.canvas-wrap{width:min(100%,500px);background:#ddd;border-radius:14px;overflow:hidden;box-shadow:0 10px 35px #0002}
canvas{display:block;width:100%;height:auto}
@media(max-width:750px){.grid,.pos-grid{grid-template-columns:1fr}.wrap{padding:12px}h1{font-size:23px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="panel">
    <h1>Generator Price Tag UFO</h1>
    <p class="sub">Masukkan Nama Brand, Tipe Barang, dan Harga. Atur koordinat & font jika diperlukan.</p>

    <!-- INPUT BRAND, TIPE, & HARGA -->
    <div class="grid">
      <div>
        <label>Nama Brand</label>
        <input id="brandInput" placeholder="Contoh: SHARP" autocomplete="off">
      </div>
      <div>
        <label>Tipe / Model Barang</label>
        <input id="tipeInput" placeholder="Contoh: 2T-C42DD1I / 42 INCH" autocomplete="off">
      </div>
      <div>
        <label>Harga (Nominal)</label>
        <input id="hargaInput" inputmode="numeric" placeholder="Contoh: 3499000">
      </div>
    </div>

    <!-- PENGATURAN POSISI & UKURAN FONT -->
    <div class="pos-box">
      <label style="color:#0b4db8;margin-bottom:10px;">⚙️ Atur Posisi (X, Y) & Ukuran Font Brand/Tipe:</label>
      <div class="pos-grid">
        <div>
          <label style="font-size:12px;">Posisi X (Brand/Tipe)</label>
          <input id="textX" type="number" value="100">
        </div>
        <div>
          <label style="font-size:12px;">Posisi Y (Brand/Tipe)</label>
          <input id="textY" type="number" value="430">
        </div>
        <div>
          <label style="font-size:12px;">Font Brand</label>
          <input id="brandSize" type="number" value="55">
        </div>
        <div>
          <label style="font-size:12px;">Font Tipe</label>
          <input id="tipeSize" type="number" value="38">
        </div>
      </div>

      <label style="color:#0b4db8;margin-bottom:10px;margin-top:10px;">⚙️ Atur Posisi (X, Y) & Ukuran Font Harga:</label>
      <div class="pos-grid">
        <div>
          <label style="font-size:12px;">Posisi X Harga</label>
          <input id="hargaX" type="number" value="230">
        </div>
        <div>
          <label style="font-size:12px;">Posisi Y Harga</label>
          <input id="hargaY" type="number" value="840">
        </div>
        <div>
          <label style="font-size:12px;">Ukuran Font Harga</label>
          <input id="hargaSize" type="number" value="85">
        </div>
      </div>
    </div>

    <div class="buttons">
      <button class="primary" id="download">⬇ Simpan Gambar (PNG)</button>
      <button class="secondary" id="clear">Bersihkan Form</button>
    </div>
  </div>

  <div class="panel">
    <div class="preview">
      <div class="canvas-wrap">
        <canvas id="c"></canvas>
      </div>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const templateImg = new Image();

// Memuat template gambar UFO
templateImg.src = 'template-ufo.jpg';
templateImg.onload = () => {
  drawCanvas();
};

const brandInput = document.getElementById('brandInput');
const tipeInput = document.getElementById('tipeInput');
const hargaInput = document.getElementById('hargaInput');

const textXInput = document.getElementById('textX');
const textYInput = document.getElementById('textY');
const brandSizeInput = document.getElementById('brandSize');
const tipeSizeInput = document.getElementById('tipeSize');

const hargaXInput = document.getElementById('hargaX');
const hargaYInput = document.getElementById('hargaY');
const hargaSizeInput = document.getElementById('hargaSize');

// Trigger update canvas saat diketik atau nilai diubah
[brandInput, tipeInput, hargaInput, textXInput, textYInput, brandSizeInput, tipeSizeInput, hargaXInput, hargaYInput, hargaSizeInput].forEach(input => {
  input.addEventListener('input', drawCanvas);
});

document.getElementById('clear').addEventListener('click', () => {
  brandInput.value = '';
  tipeInput.value = '';
  hargaInput.value = '';
  drawCanvas();
});

document.getElementById('download').addEventListener('click', () => {
  const link = document.createElement('a');
  const fileName = (brandInput.value + '-' + tipeInput.value).replace(/[^a-zA-Z0-9]/g, '_') || 'pricetag-ufo';
  link.download = fileName + '.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
});

function formatRupiah(str) {
  if(!str) return '';
  const num = str.replace(/\D/g, '');
  if(!num) return '';
  return Number(num).toLocaleString('id-ID');
}

function drawCanvas() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  
  if(templateImg.complete && templateImg.naturalWidth !== 0) {
    canvas.width = templateImg.naturalWidth;
    canvas.height = templateImg.naturalHeight;
    ctx.drawImage(templateImg, 0, 0);
  }

  const startX = Number(textXInput.value);
  let currentY = Number(textYInput.value);

  // 1. RENDER BRAND (Baris 1 - Font Lebih Besar)
  const brandText = brandInput.value.trim().toUpperCase();
  if (brandText) {
    const bSize = Number(brandSizeInput.value);
    ctx.font = '900 ' + bSize + 'px Arial, sans-serif';
    ctx.fillStyle = '#102a5c';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.fillText(brandText, startX, currentY);
    
    // Geser Y ke bawah untuk tempat Tipe
    currentY += bSize + 12; 
  }

  // 2. RENDER TIPE / MODEL (Baris 2 - Font Sedikit Lebih Kecil)
  const tipeText = tipeInput.value.trim().toUpperCase();
  if (tipeText) {
    const tSize = Number(tipeSizeInput.value);
    ctx.font = 'bold ' + tSize + 'px Arial, sans-serif';
    ctx.fillStyle = '#2c3e50';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.fillText(tipeText, startX, currentY);
  }

  // 3. RENDER HARGA PROMO
  const hargaVal = formatRupiah(hargaInput.value);
  if (hargaVal) {
    const hX = Number(hargaXInput.value);
    const hY = Number(hargaYInput.value);
    const hSize = Number(hargaSizeInput.value);

    ctx.font = '900 ' + hSize + 'px Arial, sans-serif';
    ctx.fillStyle = '#0b4db8';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';

    // Shadow Bayangan Teks Harga
    ctx.shadowColor = 'rgba(0, 0, 0, 0.2)';
    ctx.shadowBlur = 4;
    ctx.shadowOffsetX = 2;
    ctx.shadowOffsetY = 2;

    ctx.fillText(hargaVal, hX, hY);

    ctx.shadowColor = 'transparent';
    ctx.shadowBlur = 0;
  }
}
</script>
</body>
</html>
