<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UFO Kebonsari - Dashboard & Generator A4</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        * { box-sizing: border-box; font-family: 'Outfit', sans-serif !important; }
        body {
            margin: 0; padding: 20px 15px; min-height: 100vh;
            background: radial-gradient(circle at top, rgba(212, 175, 55, 0.08) 0%, transparent 60%), linear-gradient(135deg, #0b0f19 0%, #111827 100%);
            color: #f3f4f6;
        }
        #loginBox {
            max-width: 420px; margin: 50px auto; padding: 40px 30px; background: #111827;
            border-radius: 20px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(212, 175, 55, 0.3);
        }
        .login-logo-container { text-align: center; margin-bottom: 20px; }
        .login-logo-container img { width: 90px; height: 90px; border-radius: 50%; object-fit: cover; border: 2px solid rgba(212, 175, 55, 0.5); }
        .login-title-area { text-align: center; margin-bottom: 30px; }
        .login-title-area h2 { margin: 0; font-size: 22px; font-weight: 800; color: #ffffff; }
        .login-title-area p { margin: 6px 0 0; font-size: 13.5px; color: #9ca3af; }
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; font-size: 12px; font-weight: 700; color: #d1d5db; margin-bottom: 8px; }
        .input-group input, .input-group select {
            width: 100%; padding: 15px 18px; border-radius: 12px; border: 1px solid #374151;
            background: #1f2937; color: #ffffff; font-size: 14.5px; outline: none;
        }
        .input-group input:focus, .input-group select:focus { border-color: #d4af37; }
        #btnLogin {
            width: 100%; padding: 16px; border: none; border-radius: 12px; cursor: pointer;
            font-weight: 700; font-size: 15px; color: #111827; background: linear-gradient(135deg, #f3e8ff 0%, #d4af37 100%);
        }
        .header { text-align: center; margin-bottom: 25px; }
        .header h1 { font-size: 32px; font-weight: 800; margin: 0; background: linear-gradient(90deg, #ffffff, #d4af37); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .header p { color: #9ca3af; font-size: 13px; margin-top: 4px; }
        .search-box { max-width: 1100px; margin: 0 auto 15px; }
        #nama { width: 100%; height: 48px; padding: 0 16px; border-radius: 12px; border: 1px solid rgba(212, 175, 55, 0.3); background: #111827; color: #ffffff; font-weight: 600; outline: none; cursor: pointer; }
        #menuGridContainer { max-width: 1100px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        .menu-card-item {
            background: #111827; border: 1px solid rgba(212, 175, 55, 0.25); border-radius: 16px; padding: 24px 20px;
            text-align: center; cursor: pointer; transition: all 0.25s ease; box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2);
        }
        .menu-card-item:hover { transform: translateY(-3px); border-color: #d4af37; background: #151d2e; }
        .menu-card-item .icon { font-size: 38px; margin-bottom: 10px; }
        .menu-card-item h3 { margin: 0 0 6px; font-size: 18px; color: #ffffff; font-weight: 800; }
        .menu-card-item p { margin: 0; font-size: 13px; color: #9ca3af; }
        #detailViewSection { display: none; max-width: 1100px; margin: 0 auto; }
        .nav-back-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .btn-back-menu { padding: 9px 16px; border: none; border-radius: 10px; cursor: pointer; font-weight: 700; color: #111827; background: #d4af37; }
        #summary { margin-bottom: 15px; }
        .summary-card { background: #111827; border: 1px solid rgba(212, 175, 55, 0.25); border-radius: 14px; padding: 16px; color: #ffffff; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        .card { background: #111827; border: 1px solid #374151; border-radius: 16px; padding: 16px; }
        .card.success { border-left: 4px solid #10b981; }
        .tanggal { text-align: center; font-weight: 700; margin-bottom: 12px; color: #ffffff; font-size: 13.5px; }
        .row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.05); color: #9ca3af; font-size: 13px; }
        .btn-logout-main { padding: 8px 16px; border: none; border-radius: 9px; cursor: pointer; color: #f87171; background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3); font-weight: 600; }
        #popup { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); z-index: 99999; justify-content: center; align-items: center; }
        .modern-popup-box { background: #111827; padding: 25px 20px; border-radius: 16px; text-align: center; border: 1px solid rgba(212, 175, 55, 0.4); }
        .btn-popup-ok { border: none; padding: 10px 24px; border-radius: 9px; cursor: pointer; color: #111827; font-weight: 700; background: #d4af37; }
        .spinner { width: 16px; height: 16px; display: inline-block; border: 2.5px solid rgba(255,255,255,.3); border-top: 2.5px solid #fff; border-radius: 50%; animation: spin .8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media(max-width: 768px) { #menuGridContainer, .grid { grid-template-columns: 1fr !important; } }
    </style>
</head>
<body>

<!-- KOTAK LOGIN -->
<div id="loginBox">
    <div class="login-logo-container">
        <img src="logo.png" alt="UFO Logo" onerror="this.style.display='none'">
    </div>
    <div class="login-title-area">
        <h2>UFO KEBONSARI MALANG</h2>
        <p>Sistem Dashboard & Generator A4</p>
    </div>
    <div class="input-group">
        <label>USERNAME</label>
        <input id="loginNama" type="text" placeholder="Masukkan Username" oninput="this.value = this.value.toUpperCase()">
    </div>
    <div class="input-group">
        <label>PASSWORD</label>
        <input id="loginPin" type="password" placeholder="Masukkan Password" onkeypress="if(event.key === 'Enter') login()">
    </div>
    <button id="btnLogin" onclick="login()">MASUK</button>
</div>

<!-- DASHBOARD UTAMA -->
<div id="dashboard" style="display:none;">
    <div class="header">
        <h1>UFO KEBONSARI</h1>
        <p id="roleSubtitle">Dashboard Promotor</p>
    </div>

    <div style="max-width:1100px; margin:0 auto 20px; display:flex; justify-content:space-between; align-items:center;">
        <div id="loginInfo" style="padding:6px 14px; border-radius:99px; background:#111827; border:1px solid rgba(212, 175, 55, 0.3); color:#e2e8f0; font-size:12.5px; font-weight:600;"></div>
        <button class="btn-logout-main" onclick="logout()">🚪 Keluar</button>
    </div>

    <!-- MENU UTAMA -->
    <div id="menuGridContainer">
        <div class="menu-card-item" onclick="pindahMenu('ClearanceGenerator')">
            <div class="icon">🏷️</div>
            <h3>Generator Clearance</h3>
            <p>Buat poster harga diskon khusus A4 anti-pecah</p>
        </div>
    </div>

    <!-- HALAMAN DETAIL -->
    <div id="detailViewSection" style="display:none;">
        <div class="nav-back-bar">
            <button class="btn-back-menu" onclick="kembaliKeMenuUtama()">⬅ Kembali ke Menu</button>
            <div id="currentMenuTitle" style="color:#d4af37; font-weight:700; font-size:15px;"></div>
        </div>
        <div id="summary"></div>
        <div id="hasil"></div>
    </div>
</div>

<script>
let currentUser = "";
let currentRole = "";
let activeTab = ""; 

function login() {
    const nama = document.getElementById("loginNama").value.trim().toUpperCase();
    const pin = document.getElementById("loginPin").value.trim();

    if (!nama || !pin) {
        showPopup("Username dan Password harus diisi.");
        return;
    }

    currentUser = nama;
    currentRole = "USER";
    document.getElementById("loginBox").style.display = "none";
    document.getElementById("dashboard").style.display = "block";
    document.getElementById("loginInfo").innerHTML = "⭕ <b>" + currentUser + "</b>";
}

function pindahMenu(namaMenu) {
    activeTab = namaMenu;
    document.getElementById("menuGridContainer").style.display = "none";
    document.getElementById("detailViewSection").style.display = "block";
    document.getElementById("currentMenuTitle").innerText = "Menu: Generator Clearance Sale A4";

    if (namaMenu === 'ClearanceGenerator') {
        renderClearanceGenerator();
    }
}

function kembaliKeMenuUtama() {
    document.getElementById("detailViewSection").style.display = "none";
    document.getElementById("menuGridContainer").style.display = "grid";
    document.getElementById("summary").innerHTML = "";
    document.getElementById("hasil").innerHTML = "";
}

function logout() {
    currentUser = "";
    document.getElementById("dashboard").style.display = "none";
    document.getElementById("loginBox").style.display = "block";
}

function showPopup(pesan) {
    document.getElementById("popupText").innerText = pesan;
    document.getElementById("popup").style.display = "flex";
}
function tutupPopup() { document.getElementById("popup").style.display = "none"; }

// --- RENDER GENERATOR CLEARANCE SALE A4 ---
function renderClearanceGenerator() {
    document.getElementById("summary").innerHTML = `
    <div class="summary-card">
        <h2>🏷️ Generator Banner Clearance Sale (Format A4)</h2>
        <p>Masukkan nominal harga. Hasil unduhan beresolusi tinggi, tajam, dan siap dicetak tanpa pecah.</p>
    </div>`;

    let html = `
    <div class="card" style="max-width: 600px; margin: 0 auto; padding: 24px;">
        <div class="input-group">
            <label>PILIH BRAND / MERK</label>
            <select id="genBrand" class="input-field">
                <option value="beko">Beko</option>
                <option value="samsung">Samsung</option>
                <option value="lg">LG</option>
                <option value="polytron">Polytron</option>
                <option value="sharp">Sharp</option>
            </select>
        </div>

        <div class="input-group">
            <label>HARGA AWAL (CORET)</label>
            <input type="text" id="genHargaAwal" placeholder="Rp 13.998.000" oninput="formatRupiahInput(this)">
        </div>

        <div class="input-group">
            <label>HARGA CLEARANCE SALE (TERBARU)</label>
            <input type="text" id="genHargaDiskon" placeholder="Rp 8.699.000" oninput="formatRupiahInput(this)">
        </div>

        <button onclick="generatePosterA4()" style="width:100%; padding:14px; background:#d4af37; color:#111827; font-weight:800; border:none; border-radius:10px; cursor:pointer; font-size:15px; margin-top:10px;">
            🖨️ Generate & Download Poster A4 (HD)
        </button>
    </div>
    <div id="previewArea" style="margin-top:20px; text-align:center;"></div>
    `;

    document.getElementById("hasil").className = "";
    document.getElementById("hasil").innerHTML = html;
}

function formatRupiahInput(el) {
    let val = el.value.replace(/[^,\d]/g, "").toString();
    let split = val.split(",");
    let sisa = split[0].length % 3;
    let rupiah = split[0].substr(0, sisa);
    let ribuan = split[0].substr(sisa).match(/\d{3}/gi);
    if (ribuan) {
        let separator = sisa ? "." : "";
        rupiah += separator + ribuan.join(".");
    }
    rupiah = split[1] !== undefined ? rupiah + "," + split[1] : rupiah;
    el.value = rupiah ? "Rp " + rupiah : "";
}

function generatePosterA4() {
    let brand = document.getElementById("genBrand").value;
    let hargaAwal = document.getElementById("genHargaAwal").value || "Rp 0";
    let hargaDiskon = document.getElementById("genHargaDiskon").value || "Rp 0";

    showPopup("Sedang merender gambar kualitas tinggi A4...");

    let canvas = document.createElement("canvas");
    canvas.width = 2480; // Standar Resolusi Cetak A4 (300 DPI)
    canvas.height = 3508;
    let ctx = canvas.getContext("2d");

    // 1. Background Putih Bersih
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // 2. Header Atas
    ctx.fillStyle = "#0b0f19";
    ctx.fillRect(0, 0, canvas.width, 400);

    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 70px 'Outfit', sans-serif";
    ctx.fillText("UFO KEBONSARI MALANG", 100, 220);

    // 3. Banner "CLEARANCE SALE"
    ctx.fillStyle = "#e53935";
    ctx.beginPath();
    ctx.roundRect(350, 550, 1780, 450, 40);
    ctx.fill();

    ctx.fillStyle = "#ffffff";
    ctx.font = "900 150px 'Outfit', sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("CLEARANCE", canvas.width / 2, 780);

    ctx.fillStyle = "#ffb300";
    ctx.beginPath();
    ctx.roundRect(840, 920, 800, 260, 30);
    ctx.fill();

    ctx.fillStyle = "#111827";
    ctx.font = "900 130px 'Outfit', sans-serif";
    ctx.fillText("SALE", canvas.width / 2, 1100);

    // 4. Harga Awal (Dicoret)
    ctx.fillStyle = "#71717a";
    ctx.font = "700 90px 'Outfit', sans-serif";
    ctx.fillText("HARGA AWAL", canvas.width / 2, 1500);

    ctx.fillStyle = "#f43f5e";
    ctx.font = "900 180px 'Outfit', sans-serif";
    ctx.fillText(hargaAwal, canvas.width / 2, 1720);
    
    ctx.strokeStyle = "#f43f5e";
    ctx.lineWidth = 14;
    ctx.beginPath();
    ctx.moveTo(550, 1660);
    ctx.lineTo(1930, 1660);
    ctx.stroke();

    // 5. Panah Penunjuk Merah Besar
    ctx.fillStyle = "#e53935";
    ctx.beginPath();
    ctx.moveTo(canvas.width / 2 - 140, 1950);
    ctx.lineTo(canvas.width / 2 + 140, 1950);
    ctx.lineTo(canvas.width / 2 + 140, 2350);
    ctx.lineTo(canvas.width / 2 + 300, 2350);
    ctx.lineTo(canvas.width / 2, 2680);
    ctx.lineTo(canvas.width / 2 - 300, 2350);
    ctx.lineTo(canvas.width / 2 - 140, 2350);
    ctx.closePath();
    ctx.fill();

    // 6. Harga Clearance Promo
    ctx.fillStyle = "#111827";
    ctx.font = "700 100px 'Outfit', sans-serif";
    ctx.fillText("JADI HANYA", canvas.width / 2, 3000);

    ctx.fillStyle = "#10b981";
    ctx.font = "900 240px 'Outfit', sans-serif";
    ctx.fillText(hargaDiskon, canvas.width / 2, 3280);

    tutupPopup();

    let imageURL = canvas.toDataURL("image/png", 1.0);
    let previewContainer = document.getElementById("previewArea");
    previewContainer.innerHTML = `
        <div style="background:#1f2937; padding:20px; border-radius:14px; display:inline-block; border:1px solid #374151;">
            <p style="color:#34d399; font-weight:700; margin-bottom:10px;">✅ Poster A4 Berhasil Dirender (Anti-Pecah)!</p>
            <a href="${imageURL}" download="Clearance_${brand}_${Date.now()}.png" style="display:inline-block; padding:12px 24px; background:#10b981; color:#fff; font-weight:800; text-decoration:none; border-radius:8px;">
                📥 Download Gambar A4 (High Quality)
            </a>
        </div>
    `;
}
</script>

<!-- POPUP -->
<div id="popup">
  <div class="modern-popup-box">
    <h3 style="margin:0 0 10px; color:#d4af37;">Informasi</h3>
    <div id="popupText" style="margin-bottom: 15px; color: #cbd5e1;"></div>
    <button class="btn-popup-ok" onclick="tutupPopup()">OK</button>
  </div>
</div>

</body>
</html>
