<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Generator Price Tag UFO Electronics</title>

<!-- IMPORT FONT INTER -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}
body{margin:0;font-family:'Inter',sans-serif;background:#eef3fb;color:#102a5c}
.wrap{max-width:1100px;margin:auto;padding:22px}
h1{margin:0 0 6px;font-size:28px;font-weight:800}
.sub{margin:0 0 18px;color:#5b6b86}
.panel{background:white;border-radius:18px;padding:18px;box-shadow:0 8px 30px #0001;margin-bottom:20px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:14px}
label{font-weight:700;font-size:14px;display:block;margin-bottom:7px}
input, select{width:100%;padding:11px 14px;border:1px solid #ccd6e8;border-radius:10px;font-size:16px;outline:none;background:#fff;color:#102a5c;font-family:'Inter',sans-serif}
input:focus, select:focus{border-color:#1558c0;box-shadow:0 0 0 3px #1558c015}

.pos-box{background:#f4f7fc;padding:16px;border-radius:14px;margin-top:10px;border:1px solid #d8e2f3}
.pos-section{margin-bottom:14px;padding-bottom:12px;border-bottom:1px dashed #c9d6ec}
.pos-section:last-child{margin-bottom:0;padding-bottom:0;border-bottom:none}
.pos-title{font-weight:800;font-size:14px;color:#0b4db8;margin-bottom:8px}
.pos-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

.buttons{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}
button{border:0;border-radius:10px;padding:13px 18px;font-size:16px;font-weight:800;font-family:'Inter',sans-serif;cursor:pointer}
.primary{background:#0b4db8;color:#fff;box-shadow:0 4px 12px rgba(11,77,184,0.3)}
.secondary{background:#e8eef8;color:#123c78}
.preview{display:flex;justify-content:center}
.canvas-wrap{width:min(100%,500px);background:#ddd;border-radius:14px;overflow:hidden;box-shadow:0 10px 35px #0002}
canvas{display:block;width:100%;height:auto}
.hidden{display:none !important;}

@media(max-width:750px){
  .grid, .pos-grid{grid-template-columns:1fr}
  .wrap{padding:12px}
  h1{font-size:23px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="panel">
    <h1>Generator Price Tag UFO</h1>
    <p class="sub">Pilih jenis promo di bawah. Kolom input & pengaturan akan menyesuaikan jenis template secara otomatis.</p>

    <!-- PILIHAN TEMPLATE -->
    <div style="margin-bottom:16px;">
      <label style="color:#0b4db8;font-size:16px;">🎯 Pilih Jenis Promo / Template:</label>
      <select id="templateSelect">
        <option value="standar" selected>Template Standar (Brand, Tipe & Harga)</option>
        <option value="clearance">Template Clearance Sale (Harga Coret & Harga Spesial)</option>
        <option value="cashback">Template Promo Cashback</option>
      </select>
    </div>

    <!-- 1. FORM INPUT KELOMPOK PROMO STANDAR & CASHBACK -->
    <div id="formStandar" class="grid">
      <div>
        <label>Nama Brand</label>
        <input id="brandInput" placeholder="Contoh: COSMOS" autocomplete="off">
      </div>
      <div>
        <label>Tipe / Model Barang</label>
        <input id="tipeInput" placeholder="Contoh: KIPAS ANGIN 16-SDB" autocomplete="off">
      </div>
      <div>
        <label>Harga Promo</label>
        <input id="hargaInput" inputmode="numeric" placeholder="Contoh: 327000">
      </div>
      <div id="cashbackBox" class="hidden">
        <label style="color:#d0021b;">Nominal Cashback</label>
        <input id="cashbackInput" inputmode="numeric" placeholder="Contoh: 50000">
      </div>
    </div>

    <!-- 2. FORM INPUT KHUSUS CLEARANCE SALE -->
    <div id="formClearance" class="grid hidden">
      <div>
        <label>Nama Brand (Teks/Opsional)</label>
        <input id="clearanceBrand" placeholder="Contoh: SHARP" autocomplete="off">
      </div>
      <div>
        <label>Harga Normal (Dicoret)</label>
        <input id="normalInput" inputmode="numeric" placeholder="Contoh: 13998000">
      </div>
      <div>
        <label>Harga Spesial Clearance</label>
        <input id="specialInput" inputmode="numeric" placeholder="Contoh: 8699000">
      </div>
    </div>

    <!-- PANEL PENGATURAN POSISI & FONT -->
    <div class="pos-box">

      <!-- CONTROL GROUP A: PROMO STANDAR & CASHBACK -->
      <div id="ctrlStandar">
        <div class="pos-section">
          <div class="pos-title">🏷️ Nama Brand</div>
          <div class="pos-grid">
            <div><label style="font-size:12px;">Font Size</label><input id="brandSize" type="number" value="28"></div>
            <div><label style="font-size:12px;">Posisi X</label><input id="brandX" type="number" value="55"></div>
            <div><label style="font-size:12px;">Posisi Y</label><input id="brandY" type="number" value="170"></div>
          </div>
        </div>

        <div class="pos-section">
          <div class="pos-title">📱 Tipe / Model</div>
          <div class="pos-grid">
            <div><label style="font-size:12px;">Font Size</label><input id="tipeSize" type="number" value="20"></div>
            <div><label style="font-size:12px;">Posisi X</label><input id="tipeX" type="number" value="55"></div>
            <div><label style="font-size:12px;">Posisi Y</label><input id="tipeY" type="number" value="210"></div>
          </div>
        </div>

        <div class="pos-section">
          <div class="pos-title">💰 Teks Harga Promo</div>
          <div class="pos-grid">
            <div><label style="font-size:12px;">Font Size</label><input id="hargaSize" type="number" value="48"></div>
            <div><label style="font-size:12px;">Posisi X</label><input id="hargaX" type="number" value="140"></div>
            <div><label style="font-size:12px;">Posisi Y</label><input id="hargaY" type="number" value="420"></div>
          </div>
        </div>

        <div id="cashbackPosSection" class="pos-section hidden">
          <div class="pos-title" style="color:#d0021b;">🎁 Teks Cashback</div>
          <div class="pos-grid">
            <div><label style="font-size:12px;">Font Size</label><input id="cbSize" type="number" value="32"></div>
            <div><label style="font-size:12px;">Posisi X</label><input id="cbX" type="number" value="140"></div>
            <div><label style="font-size:12px;">Posisi Y</label><input id="cbY" type="number" value="530"></div>
          </div>
        </div>
      </div>

      <!-- CONTROL GROUP B: CLEARANCE SALE -->
      <div id="ctrlClearance" class="hidden">
        <div class="pos-section">
          <div class="pos-title">❌ Harga Normal (Dicoret)</div>
          <div class="pos-grid">
            <div><label style="font-size:12px;">Font Size</label><input id="normSize" type="number" value="85"></div>
            <div><label style="font-size:12px;">Posisi X</label><input id="normX" type="number" value="600"></div>
            <div><label style="font-size:12px;">Posisi Y</label><input id="normY" type="number" value="780"></div>
          </div>
        </div>

        <div class="pos-section">
          <div class="pos-title" style="color:#d0021b;">🔥 Harga Spesial</div>
          <div class="pos-grid">
            <div><label style="font-size:12px;">Font Size</label><input id="specSize" type="number" value="95"></div>
            <div><label style="font-size:12px;">Posisi X</label><input id="specX" type="number" value="600"></div>
            <div><label style="font-size:12px;">Posisi Y</label><input id="specY" type="number" value="1110"></div>
          </div>
        </div>
      </div>

    </div>

    <div class="buttons">
      <button class="primary" id="download">⬇ Simpan Gambar (PNG)</button>
      <button class="secondary" id="clear">Bersihkan Form</button>
    </div>
  </div>

  <div class="panel">
    <div class="preview">
      <div class="canvas-wrap">
        <canvas id="c"></canvas>
      </div>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const templateImg = new Image();

document.fonts.ready.then(() => { drawCanvas(); });

// FILE GAMBAR TEMPLATE SESUAI PILIHAN
const templatesData = {
  standar: { src: 'template-ufo.jpg' },
  clearance: { src: 'template-clearance.jpg' },
  cashback: { src: 'template-cashback.jpg' }
};

const templateSelect = document.getElementById('templateSelect');

// ELEMEN PROMO STANDAR
const formStandar = document.getElementById('formStandar');
const ctrlStandar = document.getElementById('ctrlStandar');
const brandInput = document.getElementById('brandInput');
const tipeInput = document.getElementById('tipeInput');
const hargaInput = document.getElementById('hargaInput');
const cashbackInput = document.getElementById('cashbackInput');
const cashbackBox = document.getElementById('cashbackBox');
const cashbackPosSection = document.getElementById('cashbackPosSection');

const brandSizeInput = document.getElementById('brandSize');
const brandXInput = document.getElementById('brandX');
const brandYInput = document.getElementById('brandY');
const tipeSizeInput = document.getElementById('tipeSize');
const tipeXInput = document.getElementById('tipeX');
const tipeYInput = document.getElementById('tipeY');
const hargaSizeInput = document.getElementById('hargaSize');
const hargaXInput = document.getElementById('hargaX');
const hargaYInput = document.getElementById('hargaY');
const cbSizeInput = document.getElementById('cbSize');
const cbXInput = document.getElementById('cbX');
const cbYInput = document.getElementById('cbY');

// ELEMEN CLEARANCE SALE
const formClearance = document.getElementById('formClearance');
const ctrlClearance = document.getElementById('ctrlClearance');
const clearanceBrand = document.getElementById('clearanceBrand');
const normalInput = document.getElementById('normalInput');
const specialInput = document.getElementById('specialInput');
const normSizeInput = document.getElementById('normSize');
const normXInput = document.getElementById('normX');
const normYInput = document.getElementById('normY');
const specSizeInput = document.getElementById('specSize');
const specXInput = document.getElementById('specX');
const specYInput = document.getElementById('specY');

function switchTemplate(key) {
  // Sembunyikan/Tampilkan UI Form yang sesuai
  if (key === 'clearance') {
    formStandar.classList.add('hidden');
    ctrlStandar.classList.add('hidden');
    formClearance.classList.remove('hidden');
    ctrlClearance.classList.remove('hidden');
  } else {
    formClearance.classList.add('hidden');
    ctrlClearance.classList.add('hidden');
    formStandar.classList.remove('hidden');
    ctrlStandar.classList.remove('hidden');

    if (key === 'cashback') {
      cashbackBox.classList.remove('hidden');
      cashbackPosSection.classList.remove('hidden');
    } else {
      cashbackBox.classList.add('hidden');
      cashbackPosSection.classList.add('hidden');
    }
  }

  templateImg.src = templatesData[key].src;
}

templateSelect.addEventListener('change', (e) => switchTemplate(e.target.value));
templateImg.onload = () => drawCanvas();

// Event Listener Otomatis untuk Semua Input
document.querySelectorAll('input').forEach(input => {
  input.addEventListener('input', drawCanvas);
});

document.getElementById('clear').addEventListener('click', () => {
  document.querySelectorAll('input').forEach(input => input.value = '');
  drawCanvas();
});

document.getElementById('download').addEventListener('click', () => {
  const link = document.createElement('a');
  link.download = 'price-tag-ufo.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
});

function formatRupiah(str) {
  if(!str) return '';
  const num = str.replace(/\D/g, '');
  return num ? Number(num).toLocaleString('id-ID') : '';
}

function wrapText(context, text, x, y, maxWidth, lineHeight) {
  const words = text.split(' ');
  let line = '';
  let currentY = y;
  for (let n = 0; n < words.length; n++) {
    let testLine = line + words[n] + ' ';
    if (context.measureText(testLine).width > maxWidth && n > 0) {
      context.fillText(line, x, currentY);
      line = words[n] + ' ';
      currentY += lineHeight;
    } else {
      line = testLine;
    }
  }
  context.fillText(line, x, currentY);
}

function drawCanvas() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  
  if(templateImg.complete && templateImg.naturalWidth !== 0) {
    canvas.width = templateImg.naturalWidth;
    canvas.height = templateImg.naturalHeight;
    ctx.drawImage(templateImg, 0, 0);
  }

  const mode = templateSelect.value;

  // --- RENDER 1: CLEARANCE SALE ---
  if (mode === 'clearance') {
    const brandText = clearanceBrand.value.trim().toUpperCase();
    if(brandText) {
      ctx.font = "900 45px 'Inter', sans-serif";
      ctx.fillStyle = '#0b4db8';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(brandText, canvas.width * 0.80, canvas.height * 0.09);
    }

    // Harga Normal (Coret)
    const normalVal = formatRupiah(normalInput.value);
    if(normalVal) {
      const nSize = Number(normSizeInput.value);
      const nX = Number(normXInput.value);
      const nY = Number(normYInput.value);

      ctx.font = "900 " + nSize + "px 'Inter', sans-serif";
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#2c3e50';
      ctx.fillText(normalVal, nX, nY);

      // Garis Coret Merah
      const textW = ctx.measureText(normalVal).width;
      ctx.strokeStyle = '#d0021b';
      ctx.lineWidth = Math.max(5, nSize / 12);
      ctx.beginPath();
      ctx.moveTo(nX - (textW / 2) - 15, nY);
      ctx.lineTo(nX + (textW / 2) + 15, nY);
      ctx.stroke();
    }

    // Harga Spesial
    const specialVal = formatRupiah(specialInput.value);
    if(specialVal) {
      const sSize = Number(specSizeInput.value);
      const sX = Number(specXInput.value);
      const sY = Number(specYInput.value);

      ctx.font = "900 " + sSize + "px 'Inter', sans-serif";
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      let gradient = ctx.createLinearGradient(0, sY - (sSize/2), 0, sY + (sSize/2));
      gradient.addColorStop(0, '#ff4d4d');
      gradient.addColorStop(1, '#b30000');

      ctx.shadowColor = 'rgba(179, 0, 0, 0.35)';
      ctx.shadowBlur = 8;
      ctx.shadowOffsetX = 3;
      ctx.shadowOffsetY = 4;

      ctx.fillStyle = gradient;
      ctx.fillText(specialVal, sX, sY);
      ctx.shadowColor = 'transparent';
    }
  } 
  // --- RENDER 2: TEMPLATE STANDAR & CASHBACK ---
  else {
    // Brand
    const brandText = brandInput.value.trim().toUpperCase();
    if (brandText) {
      const bSize = Number(brandSizeInput.value);
      const bX = Number(brandXInput.value);
      const bY = Number(brandYInput.value);
      ctx.font = "900 " + bSize + "px 'Inter', sans-serif";
      ctx.fillStyle = '#0a235c';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'top';
      wrapText(ctx, brandText, bX, bY, canvas.width - bX - 40, bSize * 1.15);
    }

    // Tipe
    const tipeText = tipeInput.value.trim().toUpperCase();
    if (tipeText) {
      const tSize = Number(tipeSizeInput.value);
      const tX = Number(tipeXInput.value);
      const tY = Number(tipeYInput.value);
      ctx.font = "600 " + tSize + "px 'Inter', sans-serif";
      ctx.fillStyle = '#3a4b68';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'top';
      wrapText(ctx, tipeText, tX, tY, canvas.width - tX - 40, tSize * 1.25);
    }

    // Harga
    const hargaVal = formatRupiah(hargaInput.value);
    if (hargaVal) {
      const hSize = Number(hargaSizeInput.value);
      const hX = Number(hargaXInput.value);
      const hY = Number(hargaYInput.value);
      ctx.font = "900 " + hSize + "px 'Inter', sans-serif";
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';

      let gradient = ctx.createLinearGradient(0, hY - (hSize/2), 0, hY + (hSize/2));
      gradient.addColorStop(0, '#0b4db8');
      gradient.addColorStop(1, '#052d75');

      ctx.shadowColor = 'rgba(10, 35, 92, 0.25)';
      ctx.shadowBlur = 6;
      ctx.shadowOffsetX = 2;
      ctx.shadowOffsetY = 3;

      ctx.fillStyle = gradient;
      ctx.fillText(hargaVal, hX, hY);
      ctx.shadowColor = 'transparent';
    }

    // Cashback
    if (mode === 'cashback') {
      const cbVal = formatRupiah(cashbackInput.value);
      if (cbVal) {
        const cbSize = Number(cbSizeInput.value);
        const cbX = Number(cbXInput.value);
        const cbY = Number(cbYInput.value);
        ctx.font = "900 " + cbSize + "px 'Inter', sans-serif";
        ctx.fillStyle = '#d0021b';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.fillText(cbVal, cbX, cbY);
      }
    }
  }
}

// Inisialisasi awal
switchTemplate('standar');
</script>
</body>
</html>
