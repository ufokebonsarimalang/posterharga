<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Generator Harga UFO Electronics Multi-Template</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#eef3fb;color:#102a5c}
.wrap{max-width:1100px;margin:auto;padding:22px}
h1{margin:0 0 6px;font-size:28px}
.sub{margin:0 0 18px;color:#5b6b86}
.panel{background:white;border-radius:18px;padding:18px;box-shadow:0 8px 30px #0001;margin-bottom:20px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:14px}
label{font-weight:700;font-size:14px;display:block;margin-bottom:7px}
input, select{width:100%;padding:11px 14px;border:1px solid #ccd6e8;border-radius:10px;font-size:16px;outline:none;background:#fff;color:#102a5c}
input:focus, select:focus{border-color:#1558c0;box-shadow:0 0 0 3px #1558c015}
.pos-box{background:#f4f7fc;padding:12px;border-radius:12px;margin-top:10px;border:1px solid #d8e2f3}
.pos-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.buttons{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}
button{border:0;border-radius:10px;padding:13px 18px;font-size:16px;font-weight:700;cursor:pointer}
.primary{background:#0b4db8;color:#fff}
.secondary{background:#e8eef8;color:#123c78}
.preview{display:flex;justify-content:center}
.canvas-wrap{width:min(100%,600px);background:#ddd;border-radius:14px;overflow:hidden;box-shadow:0 10px 35px #0002}
canvas{display:block;width:100%;height:auto}
@media(max-width:750px){.grid,.pos-grid{grid-template-columns:1fr}.wrap{padding:12px}h1{font-size:23px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="panel">
    <h1>Generator Harga UFO (Multi Template)</h1>
    <p class="sub">Pilih jenis promo/template, lalu atur angka dan posisinya agar pas di kotak template.</p>

    <!-- PILIHAN TEMPLATE PROMO -->
    <div style="margin-bottom:14px;">
      <label style="color:#0b4db8;font-size:16px;">🎯 Pilih Jenis Promo / Template:</label>
      <select id="templateSelect">
        <option value="clearance">Clearance Sale</option>
        <option value="promo_reguler">Promo Reguler</option>
        <option value="cashback">Promo Cashback</option>
      </select>
    </div>

    <div class="grid">
      <div>
        <label>Nama Brand (Jika Tanpa Logo)</label>
        <input id="brand" placeholder="Contoh: SHARP" autocomplete="off">
      </div>
      <div>
        <label>Harga Normal</label>
        <input id="normal" inputmode="numeric" placeholder="Contoh: 13998000">
      </div>
      <div>
        <label>Harga Spesial</label>
        <input id="special" inputmode="numeric" placeholder="Contoh: 8699000">
      </div>
    </div>

    <!-- PANEL PENGATURAN POSISI MANUAL -->
    <div class="pos-box">
      <label style="color:#0b4db8;margin-bottom:10px;">⚙️ Pengaturan Koordinat Angka (Otomatis berubah per template):</label>
      <div class="pos-grid">
        <div>
          <label style="font-size:12px;">Posisi X (Normal)</label>
          <input id="normX" type="number">
        </div>
        <div>
          <label style="font-size:12px;">Posisi Y (Normal)</label>
          <input id="normY" type="number">
        </div>
        <div>
          <label style="font-size:12px;">Posisi X (Spesial)</label>
          <input id="specX" type="number">
        </div>
        <div>
          <label style="font-size:12px;">Posisi Y (Spesial)</label>
          <input id="specY" type="number">
        </div>
      </div>
    </div>

    <div class="logo-row" style="margin-top:14px;">
      <label>Upload Logo Brand (Opsional)</label>
      <input id="logo" type="file" accept="image/*">
    </div>

    <div class="buttons">
      <button class="primary" id="download">⬇ Simpan Gambar (PNG)</button>
      <button class="secondary" id="clear">Bersihkan Form</button>
    </div>
  </div>

  <div class="panel">
    <div class="preview">
      <div class="canvas-wrap">
        <canvas id="c" width="1000" height="1500"></canvas>
      </div>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const templateImg = new Image();
let uploadedLogo = null;

// DATA SETTINGAN TIAP TEMPLATE (Ganti nama file & koordinat sesuai gambar Anda)
const templatesData = {
  clearance: {
    src: 'template-clearance.jpg',
    normX: 600, normY: 780,
    specX: 600, specY: 1110
  },
  promo_reguler: {
    src: 'template-promo.jpg',
    normX: 500, normY: 650,
    specX: 500, specY: 950
  },
  cashback: {
    src: 'template-cashback.jpg',
    normX: 550, normY: 720,
    specX: 550, specY: 1020
  }
};

const templateSelect = document.getElementById('templateSelect');
const brandInput = document.getElementById('brand');
const normalInput = document.getElementById('normal');
const specialInput = document.getElementById('special');
const logoInput = document.getElementById('logo');

const normXInput = document.getElementById('normX');
const normYInput = document.getElementById('normY');
const specXInput = document.getElementById('specX');
const specYInput = document.getElementById('specY');

// Fungsi Ganti Template
function switchTemplate(key) {
  const data = templatesData[key];
  normXInput.value = data.normX;
  normYInput.value = data.normY;
  specXInput.value = data.specX;
  specYInput.value = data.specY;
  
  // Memuat gambar template yang dipilih
  templateImg.src = data.src;
}

// Event saat dropdown template diubah
templateSelect.addEventListener('change', (e) => {
  switchTemplate(e.target.value);
});

// Event saat gambar template selesai dimuat
templateImg.onload = () => {
  drawCanvas();
};

// Event input diketik atau koordinat diganti
[brandInput, normalInput, specialInput, normXInput, normYInput, specXInput, specYInput].forEach(input => {
  input.addEventListener('input', drawCanvas);
});

logoInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if(file) {
    const reader = new FileReader();
    reader.onload = (event) => {
      const img = new Image();
      img.onload = () => {
        uploadedLogo = img;
        drawCanvas();
      };
      img.src = event.target.result;
    };
    reader.readAsDataURL(file);
  } else {
    uploadedLogo = null;
    drawCanvas();
  }
});

document.getElementById('clear').addEventListener('click', () => {
  brandInput.value = '';
  normalInput.value = '';
  specialInput.value = '';
  logoInput.value = '';
  uploadedLogo = null;
  drawCanvas();
});

document.getElementById('download').addEventListener('click', () => {
  const link = document.createElement('a');
  link.download = (brandInput.value || 'ufo-promo') + '.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
});

function formatRupiah(str) {
  if(!str) return '';
  const num = str.replace(/\D/g, '');
  if(!num) return '';
  return Number(num).toLocaleString('id-ID');
}

function drawCanvas() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  
  if(templateImg.complete && templateImg.naturalWidth !== 0) {
    canvas.width = templateImg.naturalWidth;
    canvas.height = templateImg.naturalHeight;
    ctx.drawImage(templateImg, 0, 0);
  }

  const w = canvas.width;
  const h = canvas.height;

  // 1. LOGO BRAND
  if (uploadedLogo) {
    const targetW = w * 0.30;
    const targetH = h * 0.12;
    const targetX = w * 0.65;
    const targetY = h * 0.04;
    
    let hRatio = targetW / uploadedLogo.width;
    let vRatio = targetH / uploadedLogo.height;
    let ratio  = Math.min(hRatio, vRatio);
    
    let centerShiftX = (targetW - uploadedLogo.width * ratio) / 2;
    let centerShiftY = (targetH - uploadedLogo.height * ratio) / 2;  
    
    ctx.fillStyle = '#FFFFFF';
    ctx.fillRect(targetX, targetY, targetW, targetH);

    ctx.drawImage(uploadedLogo, 0, 0, uploadedLogo.width, uploadedLogo.height,
                  targetX + centerShiftX, targetY + centerShiftY, uploadedLogo.width * ratio, uploadedLogo.height * ratio);
  } else {
    const brandText = brandInput.value.toUpperCase();
    if(brandText) {
      ctx.font = 'bold 45px Arial, sans-serif';
      ctx.fillStyle = '#0b4db8';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(brandText, w * 0.80, h * 0.09);
    }
  }

  const fontSize = 85;

  const normX = Number(normXInput.value);
  const normY = Number(normYInput.value);
  const specX = Number(specXInput.value);
  const specY = Number(specYInput.value);

  // 2. HARGA NORMAL
  const normalVal = formatRupiah(normalInput.value);
  if(normalVal) {
    ctx.font = '900 ' + fontSize + 'px Arial, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    ctx.shadowColor = 'rgba(0, 0, 0, 0.25)';
    ctx.shadowBlur = 6;
    ctx.shadowOffsetX = 3;
    ctx.shadowOffsetY = 3;

    ctx.fillStyle = '#2c3e50';
    ctx.fillText(normalVal, normX, normY);

    ctx.shadowColor = 'transparent';
    ctx.shadowBlur = 0;
    ctx.shadowOffsetX = 0;
    ctx.shadowOffsetY = 0;
    
    const textW = ctx.measureText(normalVal).width;
    ctx.strokeStyle = '#d0021b';
    ctx.lineWidth = 7;
    ctx.beginPath();
    ctx.moveTo(normX - (textW / 2) - 20, normY);
    ctx.lineTo(normX + (textW / 2) + 20, normY);
    ctx.stroke();
  }

  // 3. HARGA SPESIAL
  const specialVal = formatRupiah(specialInput.value);
  if(specialVal) {
    ctx.font = '900 ' + (fontSize + 10) + 'px Arial, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    let gradient = ctx.createLinearGradient(0, specY - 45, 0, specY + 45);
    gradient.addColorStop(0, '#ff4d4d');
    gradient.addColorStop(1, '#b30000');

    ctx.shadowColor = 'rgba(179, 0, 0, 0.35)';
    ctx.shadowBlur = 8;
    ctx.shadowOffsetX = 3;
    ctx.shadowOffsetY = 4;

    ctx.fillStyle = gradient;
    ctx.fillText(specialVal, specX, specY);

    ctx.shadowColor = 'transparent';
    ctx.shadowBlur = 0;
  }
}

// Inisialisasi awal saat halaman dibuka
switchTemplate('clearance');
</script>
</body>
</html>
