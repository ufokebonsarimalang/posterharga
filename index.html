<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Generator Price Tag UFO Electronics - Modern Style</title>

<!-- IMPORT FONT INTER DARI GOOGLE FONTS -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}
body{margin:0;font-family:'Inter',sans-serif;background:#eef3fb;color:#102a5c}
.wrap{max-width:1100px;margin:auto;padding:22px}
h1{margin:0 0 6px;font-size:28px;font-weight:800}
.sub{margin:0 0 18px;color:#5b6b86}
.panel{background:white;border-radius:18px;padding:18px;box-shadow:0 8px 30px #0001;margin-bottom:20px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:14px}
label{font-weight:700;font-size:14px;display:block;margin-bottom:7px}
input, select{width:100%;padding:11px 14px;border:1px solid #ccd6e8;border-radius:10px;font-size:16px;outline:none;background:#fff;color:#102a5c;font-family:'Inter',sans-serif}
input:focus, select:focus{border-color:#1558c0;box-shadow:0 0 0 3px #1558c015}

.pos-box{background:#f4f7fc;padding:16px;border-radius:14px;margin-top:10px;border:1px solid #d8e2f3}
.pos-section{margin-bottom:14px;padding-bottom:12px;border-bottom:1px dashed #c9d6ec}
.pos-section:last-child{margin-bottom:0;padding-bottom:0;border-bottom:none}
.pos-title{font-weight:800;font-size:14px;color:#0b4db8;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.pos-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

.buttons{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}
button{border:0;border-radius:10px;padding:13px 18px;font-size:16px;font-weight:800;font-family:'Inter',sans-serif;cursor:pointer}
.primary{background:#0b4db8;color:#fff;box-shadow:0 4px 12px rgba(11,77,184,0.3)}
.secondary{background:#e8eef8;color:#123c78}
.preview{display:flex;justify-content:center}
.canvas-wrap{width:min(100%,500px);background:#ddd;border-radius:14px;overflow:hidden;box-shadow:0 10px 35px #0002}
canvas{display:block;width:100%;height:auto}
.hidden{display:none !important;}

@media(max-width:750px){
  .grid, .pos-grid{grid-template-columns:1fr}
  .wrap{padding:12px}
  h1{font-size:23px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="panel">
    <h1>Generator Price Tag UFO (Font Inter & Efek Modern)</h1>
    <p class="sub">Pilih jenis template, lalu isi data brand, tipe, dan harganya.</p>

    <!-- PILIHAN TEMPLATE (CLEARANCE SALE KEMBALI DITAMBAHKAN) -->
    <div style="margin-bottom:16px;">
      <label style="color:#0b4db8;font-size:16px;">🎯 Pilih Jenis Template / Promo:</label>
      <select id="templateSelect">
        <option value="clearance">Clearance Sale</option>
        <option value="standar">Template Standar / Promo Reguler</option>
        <option value="cashback">Template Promo Cashback</option>
      </select>
    </div>

    <!-- INPUT DATA -->
    <div class="grid">
      <div>
        <label>Nama Brand</label>
        <input id="brandInput" placeholder="Contoh: COSMOS" autocomplete="off">
      </div>
      <div>
        <label>Tipe / Model Barang</label>
        <input id="tipeInput" placeholder="Contoh: KIPAS ANGIN 16-SDB" autocomplete="off">
      </div>
      <div>
        <label>Harga (Nominal)</label>
        <input id="hargaInput" inputmode="numeric" placeholder="Contoh: 327000">
      </div>
      <!-- INPUT CASHBACK (Khusus template cashback) -->
      <div id="cashbackBox" class="hidden">
        <label style="color:#d0021b;">Nominal Cashback</label>
        <input id="cashbackInput" inputmode="numeric" placeholder="Contoh: 50000">
      </div>
    </div>

    <!-- PENGATURAN POSISI & UKURAN FONT PER ELEMEN -->
    <div class="pos-box">

      <!-- 1. BRAND -->
      <div class="pos-section">
        <div class="pos-title">🏷️ Teks Nama Brand</div>
        <div class="pos-grid">
          <div>
            <label style="font-size:12px;">Ukuran Font</label>
            <input id="brandSize" type="number" value="28">
          </div>
          <div>
            <label style="font-size:12px;">Posisi X (Kiri-Kanan)</label>
            <input id="brandX" type="number" value="55">
          </div>
          <div>
            <label style="font-size:12px;">Posisi Y (Atas-Bawah)</label>
            <input id="brandY" type="number" value="170">
          </div>
        </div>
      </div>

      <!-- 2. TIPE / MODEL -->
      <div class="pos-section">
        <div class="pos-title">📱 Teks Tipe / Model</div>
        <div class="pos-grid">
          <div>
            <label style="font-size:12px;">Ukuran Font</label>
            <input id="tipeSize" type="number" value="20">
          </div>
          <div>
            <label style="font-size:12px;">Posisi X (Kiri-Kanan)</label>
            <input id="tipeX" type="number" value="55">
          </div>
          <div>
            <label style="font-size:12px;">Posisi Y (Atas-Bawah)</label>
            <input id="tipeY" type="number" value="210">
          </div>
        </div>
      </div>

      <!-- 3. HARGA -->
      <div class="pos-section">
        <div class="pos-title">💰 Teks Harga (Efek 3D / Shadow)</div>
        <div class="pos-grid">
          <div>
            <label style="font-size:12px;">Ukuran Font</label>
            <input id="hargaSize" type="number" value="48">
          </div>
          <div>
            <label style="font-size:12px;">Posisi X (Kiri-Kanan)</label>
            <input id="hargaX" type="number" value="140">
          </div>
          <div>
            <label style="font-size:12px;">Posisi Y (Atas-Bawah)</label>
            <input id="hargaY" type="number" value="420">
          </div>
        </div>
      </div>

      <!-- 4. CASHBACK (Kalo Aktif) -->
      <div id="cashbackPosSection" class="pos-section hidden">
        <div class="pos-title" style="color:#d0021b;">🎁 Teks Cashback</div>
        <div class="pos-grid">
          <div>
            <label style="font-size:12px;">Ukuran Font</label>
            <input id="cbSize" type="number" value="32">
          </div>
          <div>
            <label style="font-size:12px;">Posisi X (Kiri-Kanan)</label>
            <input id="cbX" type="number" value="140">
          </div>
          <div>
            <label style="font-size:12px;">Posisi Y (Atas-Bawah)</label>
            <input id="cbY" type="number" value="530">
          </div>
        </div>
      </div>

    </div>

    <div class="buttons">
      <button class="primary" id="download">⬇ Simpan Gambar (PNG)</button>
      <button class="secondary" id="clear">Bersihkan Form</button>
    </div>
  </div>

  <div class="panel">
    <div class="preview">
      <div class="canvas-wrap">
        <canvas id="c"></canvas>
      </div>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const templateImg = new Image();

document.fonts.ready.then(() => {
  drawCanvas();
});

// DATA PRESET UNTUK 3 TEMPLATE LENGKAP
const templatesData = {
  clearance: {
    src: 'template-clearance.jpg',
    brandSize: 28, brandX: 55, brandY: 170,
    tipeSize: 20, tipeX: 55, tipeY: 210,
    hargaSize: 48, hargaX: 140, hargaY: 420
  },
  standar: {
    src: 'template-ufo.jpg',
    brandSize: 28, brandX: 55, brandY: 170,
    tipeSize: 20, tipeX: 55, tipeY: 210,
    hargaSize: 48, hargaX: 140, hargaY: 420
  },
  cashback: {
    src: 'template-cashback.jpg',
    brandSize: 28, brandX: 55, brandY: 150,
    tipeSize: 20, tipeX: 55, tipeY: 190,
    hargaSize: 44, hargaX: 140, hargaY: 370,
    cbSize: 32, cbX: 140, cbY: 530
  }
};

const templateSelect = document.getElementById('templateSelect');
const brandInput = document.getElementById('brandInput');
const tipeInput = document.getElementById('tipeInput');
const hargaInput = document.getElementById('hargaInput');
const cashbackInput = document.getElementById('cashbackInput');
const cashbackBox = document.getElementById('cashbackBox');
const cashbackPosSection = document.getElementById('cashbackPosSection');

const brandSizeInput = document.getElementById('brandSize');
const brandXInput = document.getElementById('brandX');
const brandYInput = document.getElementById('brandY');

const tipeSizeInput = document.getElementById('tipeSize');
const tipeXInput = document.getElementById('tipeX');
const tipeYInput = document.getElementById('tipeY');

const hargaSizeInput = document.getElementById('hargaSize');
const hargaXInput = document.getElementById('hargaX');
const hargaYInput = document.getElementById('hargaY');

const cbSizeInput = document.getElementById('cbSize');
const cbXInput = document.getElementById('cbX');
const cbYInput = document.getElementById('cbY');

function switchTemplate(key) {
  const data = templatesData[key];
  
  brandSizeInput.value = data.brandSize;
  brandXInput.value = data.brandX;
  brandYInput.value = data.brandY;

  tipeSizeInput.value = data.tipeSize;
  tipeXInput.value = data.tipeX;
  tipeYInput.value = data.tipeY;

  hargaSizeInput.value = data.hargaSize;
  hargaXInput.value = data.hargaX;
  hargaYInput.value = data.hargaY;

  if (key === 'cashback') {
    cashbackBox.classList.remove('hidden');
    cashbackPosSection.classList.remove('hidden');
    if(data.cbSize) {
      cbSizeInput.value = data.cbSize;
      cbXInput.value = data.cbX;
      cbYInput.value = data.cbY;
    }
  } else {
    cashbackBox.classList.add('hidden');
    cashbackPosSection.classList.add('hidden');
  }
  
  templateImg.src = data.src;
}

templateSelect.addEventListener('change', (e) => {
  switchTemplate(e.target.value);
});

templateImg.onload = () => {
  drawCanvas();
};

[brandInput, tipeInput, hargaInput, cashbackInput, 
 brandSizeInput, brandXInput, brandYInput,
 tipeSizeInput, tipeXInput, tipeYInput,
 hargaSizeInput, hargaXInput, hargaYInput,
 cbSizeInput, cbXInput, cbYInput].forEach(input => {
  input.addEventListener('input', drawCanvas);
});

document.getElementById('clear').addEventListener('click', () => {
  brandInput.value = '';
  tipeInput.value = '';
  hargaInput.value = '';
  cashbackInput.value = '';
  drawCanvas();
});

document.getElementById('download').addEventListener('click', () => {
  const link = document.createElement('a');
  const fileName = (brandInput.value + '-' + tipeInput.value).replace(/[^a-zA-Z0-9]/g, '_') || 'pricetag-ufo';
  link.download = fileName + '.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
});

function formatRupiah(str) {
  if(!str) return '';
  const num = str.replace(/\D/g, '');
  if(!num) return '';
  return Number(num).toLocaleString('id-ID');
}

function wrapText(context, text, x, y, maxWidth, lineHeight) {
  const words = text.split(' ');
  let line = '';
  let currentY = y;

  for (let n = 0; n < words.length; n++) {
    let testLine = line + words[n] + ' ';
    let metrics = context.measureText(testLine);
    let testWidth = metrics.width;
    if (testWidth > maxWidth && n > 0) {
      context.fillText(line, x, currentY);
      line = words[n] + ' ';
      currentY += lineHeight;
    } else {
      line = testLine;
    }
  }
  context.fillText(line, x, currentY);
  return currentY + lineHeight;
}

function drawCanvas() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  
  if(templateImg.complete && templateImg.naturalWidth !== 0) {
    canvas.width = templateImg.naturalWidth;
    canvas.height = templateImg.naturalHeight;
    ctx.drawImage(templateImg, 0, 0);
  }

  // 1. RENDER BRAND (Inter 900 Extra Bold)
  const brandText = brandInput.value.trim().toUpperCase();
  if (brandText) {
    const bSize = Number(brandSizeInput.value);
    const bX = Number(brandXInput.value);
    const bY = Number(brandYInput.value);
    const maxWidth = canvas.width - bX - 40;

    ctx.font = '900 ' + bSize + "px 'Inter', sans-serif";
    ctx.fillStyle = '#0a235c';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    wrapText(ctx, brandText, bX, bY, maxWidth, bSize * 1.15);
  }

  // 2. RENDER TIPE / MODEL (Inter 600 Semi-Bold)
  const tipeText = tipeInput.value.trim().toUpperCase();
  if (tipeText) {
    const tSize = Number(tipeSizeInput.value);
    const tX = Number(tipeXInput.value);
    const tY = Number(tipeYInput.value);
    const maxWidth = canvas.width - tX - 40;

    ctx.font = "600 " + tSize + "px 'Inter', sans-serif";
    ctx.fillStyle = '#3a4b68';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    wrapText(ctx, tipeText, tX, tY, maxWidth, tSize * 1.25);
  }

  // 3. RENDER HARGA PROMO (Efek Bayangan 3D Ritel Modern)
  const hargaVal = formatRupiah(hargaInput.value);
  if (hargaVal) {
    const hSize = Number(hargaSizeInput.value);
    const hX = Number(hargaXInput.value);
    const hY = Number(hargaYInput.value);

    ctx.font = "900 " + hSize + "px 'Inter', sans-serif";

    // Layer 1: Bayangan Lembut (Drop Shadow)
    ctx.shadowColor = 'rgba(10, 35, 92, 0.25)';
    ctx.shadowBlur = 6;
    ctx.shadowOffsetX = 2;
    ctx.shadowOffsetY = 3;

    // Layer 2: Gradien Warna Biru Metalik
    let gradient = ctx.createLinearGradient(0, hY - (hSize/2), 0, hY + (hSize/2));
    gradient.addColorStop(0, '#0b4db8');
    gradient.addColorStop(1, '#052d75');

    ctx.fillStyle = gradient;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';

    ctx.fillText(hargaVal, hX, hY);
    ctx.shadowColor = 'transparent';
  }

  // 4. RENDER CASHBACK
  if (templateSelect.value === 'cashback') {
    const cbVal = formatRupiah(cashbackInput.value);
    if (cbVal) {
      const cbSize = Number(cbSizeInput.value);
      const cbX = Number(cbXInput.value);
      const cbY = Number(cbYInput.value);

      ctx.font = "900 " + cbSize + "px 'Inter', sans-serif";
      
      ctx.shadowColor = 'rgba(208, 2, 27, 0.3)';
      ctx.shadowBlur = 4;
      ctx.shadowOffsetX = 1;
      ctx.shadowOffsetY = 2;

      ctx.fillStyle = '#d0021b';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';

      ctx.fillText(cbVal, cbX, cbY);
      ctx.shadowColor = 'transparent';
    }
  }
}

switchTemplate('clearance');
</script>
</body>
</html>
